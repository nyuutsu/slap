[package]
name = "rusty-slap"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The default backend is the pure-Rust libbz2-rs-sys;
# the C-backed bzip2-sys sits behind an off-by-default feature and stays off.
bzip2 = "0.6"
# Store + Deflate only; default features off to keep the C-backed codecs out.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
lzma-rs = { version = "0.3", default-features = false }
# The LZMA2 encoder (lzma-rs decodes only). Skipping its xz feature keeps its one
# dependency out, leaving the crate dependency-free; rusty-slap frames the xz
# container itself in xdelta3_lzma.rs.
lzma-rust2 = { version = "0.16.4", default-features = false, features = ["std", "encoder", "optimization"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
