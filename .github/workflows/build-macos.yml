name: Build macOS ARM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.2'
          cabal-version: 'latest'

      - name: Build
        run: cabal build

      - name: Collect binary
        run: |
          mkdir -p dist
          cp "$(cabal -v0 list-bin slap)" dist/slap
          file dist/slap

      - uses: actions/upload-artifact@v4
        with:
          name: slap-macos-arm64
          path: dist/slap
