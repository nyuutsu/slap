<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slap</title>
<link rel="icon" href="art/bandage.svg" type="image/svg+xml">
<link rel="preload" href="fonts/sarasamonoj-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="page/main.mjs"></script>
</head>
<body>

<a class="skip-link" href="#stage">skip to the patching</a>

<div class="page">

  <header class="masthead">
    <span class="sticker">
      <img src="art/bandage.svg" alt="" width="26" height="26">
      <h1 class="sticker-word">slap</h1>
    </span>
    <a class="motd" href="https://github.com/nyuutsu/slap/releases">
      <span class="motd-banner">
        <pre class="motd-wordmark" aria-hidden="true">█▀▀ █   ▄▀█ █▀█  
▄▄█ █▄▄ █▀█ █▀▀  </pre>
        <span class="motd-lines">
          <span class="motd-label">MOTD:</span> btw, I also work in the terminal<br>
          <span class="motd-prompt" aria-hidden="true">❯</span> <span class="motd-command">slap</span> <span class="motd-flag">--help</span><span class="motd-cursor" aria-hidden="true"></span>
          <span class="visually-hidden"> — slap releases on GitHub</span>
        </span>
      </span>
    </a>
  </header>

  <nav>
    <div class="verbs" id="verbs" role="tablist" aria-label="what to do"></div>
  </nav>

  <main>
    <noscript>
      <p class="noscript-note">slap does its patching here in the browser, so it wants javascript switched on to do
        anything at all. if you would rather it did not run in a browser: the same slap runs at a terminal, and asks
        nothing of the sort. it is on <a href="https://github.com/nyuutsu/slap">github</a>.</p>
    </noscript>
    <form class="stage" id="stage" role="tabpanel"></form>

    <section class="answer" aria-label="the answer">
      <div class="fellow-seat" id="fellow" aria-hidden="true"></div>
      <div class="voice" id="voice" aria-live="polite" tabindex="-1"></div>
    </section>

    <section class="tutor" id="tutor" aria-label="command equivalent"></section>

    <div class="act" id="act"></div>
  </main>

  <footer class="signature">
    <a class="makers-mark" href="https://nyuu.page">made at nyuu<span class="amber-dot">.</span>page</a>
  </footer>

</div>

<div class="dropveil" id="dropveil" hidden>
  <span>drop them anywhere — slap will sort them out</span>
</div>

<input type="file" id="file-picker" hidden>

</body>
</html>
