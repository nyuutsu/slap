<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slap</title>
<link rel="icon" href="art/bandage.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="page/main.mjs"></script>
</head>
<body>

<div class="page">

  <header class="masthead">
    <span class="sticker">
      <img src="art/bandage.svg" alt="" width="26" height="26">
      <span class="sticker-word">slap</span>
    </span>
    <p class="tagline">Apply a patch. Make one. Look inside one. —
      <span id="format-count">twenty</span> formats, and nothing you choose ever leaves your browser.</p>
  </header>

  <nav class="verbs" id="verbs" aria-label="what to do"></nav>

  <main>
    <noscript>
      <p class="noscript-note">slap does its patching here in the browser, so it wants javascript switched on to do
        anything at all. if you would rather it did not run in a browser: the same slap runs at a terminal, and asks
        nothing of the sort. it is on <a href="https://github.com/nyuutsu/slap">github</a>.</p>
    </noscript>
    <section class="stage" id="stage"></section>

    <section class="answer">
      <div class="fellow-seat" id="fellow" aria-hidden="true"></div>
      <div class="voice" id="voice" aria-live="polite"></div>
    </section>

    <section class="tutor">
      <p class="tutor-label">
        <span class="has-story" tabindex="0" data-story="CommandEquivalent">command equivalent</span>
        <button class="quiet-button" id="copy-command" data-action="copy-command">copy</button>
      </p>
      <pre class="terminal" id="command"></pre>
    </section>

    <section class="act" id="act"></section>
  </main>

  <footer class="signature">
    <a class="standing-note" href="https://github.com/nyuutsu/slap">slap runs at a terminal too · github</a>
    <a class="makers-mark" href="https://nyuu.page">made at nyuu<span class="amber-dot">.</span>page</a>
  </footer>

</div>

<div class="dropveil" id="dropveil" hidden>
  <span>drop them anywhere — slap will sort them out</span>
</div>

<input type="file" id="file-picker" hidden>

</body>
</html>
